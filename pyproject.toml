[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "branchkit"
version = "0.1.1"
description = "BranchKit plugin SDK for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "BranchKit" }]
# Stdlib-only by design: the SDK forces no third-party dependency on
# any plugin (DESIGN_PLUGIN_SDK_SPEC §4.6).
dependencies = []

[project.urls]
Homepage = "https://branchkit.dev"
Repository = "https://github.com/branchkit/plugin-sdk-py"

[tool.setuptools]
packages = ["branchkit"]
