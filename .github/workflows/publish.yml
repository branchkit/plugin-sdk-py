name: Publish to PyPI

# Publishing is credential-free: PyPI's Trusted Publishing exchanges GitHub's
# short-lived OIDC token for an upload token at job time. There is no API
# token in this repo, in GitHub secrets, or on anyone's laptop — which is
# also why `id-token: write` below is load-bearing rather than boilerplate.
#
# PyPI trusts exactly this repository AND this workflow filename, so renaming
# the file breaks publishing until the trusted publisher is updated to match.

on:
  push:
    tags: ["v*"]
  # Lets the first release happen without a tag, to claim the project name.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      # A tag that disagrees with pyproject publishes a version nobody asked
      # for, and PyPI releases cannot be replaced — only yanked. Cheaper to
      # fail here.
      - name: Tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$packaged" ]; then
            echo "tag $tag != pyproject version $packaged" >&2
            exit 1
          fi

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
